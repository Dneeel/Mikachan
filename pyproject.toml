[project]
name = "mikachan"
version = "0.1.0"
description = "Private Telegram media utility"
requires-python = ">=3.12"
dependencies = [
  "aiogram==3.22.0",
  "httpx==0.28.1",
  "beautifulsoup4==4.15.0",
  "yt-dlp==2026.8.19",
  "yt-dlp-community-plugin @ git+https://github.com/biggestsonicfan/yt-dlp-community-plugin@7966b80209c1c1355b51469f1a338c90bd8b91f9",
  "gallery-dl==1.32.16",
  "feedparser==6.0.12",
  "ytmusicapi==1.11.4",
  "pydantic-settings==2.10.1",
  "yt-dlp-ejs>=0.8,<1",
  "deno>=2.6.6,<3",
]
[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-asyncio==1.2.0", "ruff==0.13.2", "mypy==1.18.2"]
[project.scripts]
mikachan = "mikachan.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.metadata]
allow-direct-references = true
[tool.hatch.build.targets.wheel]
packages = ["src/mikachan"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
[tool.ruff]
line-length = 100
