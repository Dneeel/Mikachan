[project]
name = "mika-nexus"
version = "0.1.0"
description = "Private Telegram media utility"
requires-python = ">=3.12"
dependencies = [
  "aiogram==3.22.0",
  "httpx==0.28.1",
  "yt-dlp==2026.8.19",
  "gallery-dl==1.32.16",
  "feedparser==6.0.12",
  "ytmusicapi==1.11.4",
  "pydantic-settings==2.10.1",
]
[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-asyncio==1.2.0", "ruff==0.13.2", "mypy==1.18.2"]
[project.scripts]
mika-nexus = "mika_nexus.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/mika_nexus"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
[tool.ruff]
line-length = 100
